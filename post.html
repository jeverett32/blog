<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | The John Everett</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Chomsky&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

    <style>
        @import url('https://fonts.cdnfonts.com/css/chomsky');

        :root {
            --color-gold: #D4AF37;
            --color-black: #121212;
            --color-gray-dark: #333333;
            --color-gray-medium: #666666;
            --color-gray-light: #e5e7eb;
        }
        body {
            background-color: #FAFAFA;
            color: var(--color-black);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-masthead {
            font-family: 'Chomsky', 'Playfair Display', serif;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .article-body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--color-black);
        }
        .article-body p {
            margin-bottom: 1.5rem;
        }
        .article-body h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1.25rem;
            line-height: 1.3;
        }
        .article-body h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .article-body ul, .article-body ol {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }
        .article-body li {
            margin-bottom: 0.5rem;
        }
        .article-body em {
            font-style: italic;
        }
        .article-body strong {
            font-weight: 600;
        }
        .article-body blockquote {
            border-left: 3px solid var(--color-black);
            padding-left: 1.5rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--color-gray-dark);
        }
        .article-body a {
            color: var(--color-gold);
            text-decoration: underline;
        }
        .article-body a:hover {
            color: var(--color-black);
        }
        .article-body code {
            background-color: #f5f5f5;
            padding: 0.125rem 0.25rem;
            border-radius: 3px;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
        }
        .article-body pre {
            background-color: #f5f5f5;
            padding: 1.25rem;
            border-radius: 4px;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border: 1px solid #e5e5e5;
        }
        .article-body pre code {
            background-color: transparent;
            padding: 0;
        }
        .article-body img {
            max-width: 100%;
            height: auto;
            margin: 2rem 0;
        }
        .dropcap::first-letter {
            float: left;
            font-size: 5rem;
            line-height: 0.85;
            font-weight: 700;
            margin-right: 0.25rem;
            font-family: 'Playfair Display', serif;
            color: var(--color-gold);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#FAFAFA]">

    <header class="flex flex-col w-full border-b-4 border-black mb-8 bg-white">
        <!-- Top Bar -->
        <div class="flex justify-between items-center py-1 px-4 sm:px-8 border-b border-gray-200 text-[11px] font-[Plus Jakarta Sans] uppercase tracking-widest text-gray-500">
            <div class="flex items-center gap-4">
                <a href="/" class="hover:text-[#D4AF37] transition-colors">&larr; Back to Home</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="https://johnreverett.com" class="hover:text-[#D4AF37] transition-colors">Portfolio</a>
                <a href="https://github.com/jeverett32" class="hover:text-[#D4AF37] transition-colors">GitHub</a>
            </div>
        </div>

        <!-- Masthead -->
        <div class="py-6 sm:py-8 flex flex-col items-center justify-center">
            <a href="/" class="text-3xl sm:text-5xl md:text-6xl font-masthead font-black tracking-tight text-black text-center px-4 leading-none">
                The John Everett
            </a>
            <div class="mt-2 flex items-center gap-3">
                <div class="h-px w-8 sm:w-12 bg-gray-300"></div>
                <span class="font-serif italic text-sm sm:text-base text-gray-500">Engineering & Analytics</span>
                <div class="h-px w-8 sm:w-12 bg-gray-300"></div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
        
        <div id="loading" class="flex flex-col items-center justify-center py-32">
            <div class="w-16 h-1 bg-black animate-pulse mb-4"></div>
            <p class="font-serif italic text-gray-400">Loading article...</p>
        </div>

        <article id="content" class="hidden bg-white p-8 md:p-12 my-8 border border-gray-200">
            <!-- Article Header -->
            <header class="mb-10 pb-8 border-b border-gray-200">
                <div class="flex gap-2 mb-4">
                    <span id="post-tag" class="text-xs font-bold font-[Plus Jakarta Sans] tracking-widest uppercase text-[#D4AF37]"></span>
                </div>
                <h1 id="post-title" class="text-3xl md:text-5xl lg:text-6xl font-serif font-bold leading-tight mb-6 text-gray-900"></h1>
                <div class="flex items-center text-xs text-gray-400 font-[Plus Jakarta Sans] uppercase tracking-wide">
                    <span>By <span class="text-gray-900 font-bold">John Everett</span></span>
                    <span class="mx-2">•</span>
                    <span id="post-date"></span>
                    <span class="mx-2">•</span>
                    <span id="post-read-time"></span>
                </div>
            </header>

            <!-- Feature Image -->
            <figure id="post-image-container" class="mb-12 hidden">
                <div class="border border-gray-200 overflow-hidden">
                    <img id="post-image" class="w-full aspect-[16/9] object-cover grayscale-[10%]" alt="">
                </div>
                <figcaption class="text-xs text-gray-500 mt-3 italic text-center" id="post-caption"></figcaption>
            </figure>

            <!-- Article Body -->
            <div id="markdown-body" class="article-body max-w-3xl mx-auto"></div>

            <!-- Share & Tags -->
            <div class="mt-16 pt-8 border-t border-gray-200 max-w-3xl mx-auto">
                <div class="flex flex-wrap items-center gap-3">
                    <span class="text-xs font-bold font-[Plus Jakarta Sans] uppercase tracking-widest text-gray-500">Filed Under:</span>
                    <div id="post-tags" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
        </article>

        <!-- Related Articles -->
        <section class="my-16">
            <h2 class="font-[Plus Jakarta Sans] font-bold text-xs uppercase tracking-widest border-t-2 border-black pt-2 mb-8">
                More to Read
            </h2>
            <div id="related-articles" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </section>

    </main>

    <footer class="border-t border-gray-200 bg-white mt-20 pb-12 pt-8">
        <div class="max-w-7xl mx-auto px-4 flex flex-col items-center">
            <div class="font-masthead text-3xl mb-6">The John Everett</div>
            <nav class="flex flex-wrap justify-center gap-6 mb-8 text-xs font-[Plus Jakarta Sans] font-bold uppercase tracking-widest text-gray-500">
                <a href="/" class="hover:text-black">Home</a>
                <a href="/admin" class="hover:text-black">Admin</a>
                <a href="https://johnreverett.com" class="hover:text-black">Portfolio</a>
                <a href="https://johnreverett.com/#contact" class="hover:text-black">Contact</a>
            </nav>
            <p class="text-gray-400 text-xs font-serif italic">
                © <span id="footer-year"></span> John Everett. All rights reserved. 
            </p>
        </div>
    </footer>

    <script>
        // Set footer year
        document.getElementById('footer-year').textContent = new Date().getFullYear();

        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('id');

        if (!slug) window.location.href = '/';

        async function loadPost() {
            try {
                // Fetch the raw markdown file
                const res = await fetch(`posts/${slug}.md`);
                if (!res.ok) throw new Error("Post not found");
                const text = await res.text();

                // Parse frontmatter and body
                const parts = text.split('---');
                const body = parts.slice(2).join('---').trim();

                // Render Markdown with dropcap on first paragraph
                let htmlContent = marked.parse(body);
                htmlContent = htmlContent.replace('<p>', '<p class="dropcap">');
                document.getElementById('markdown-body').innerHTML = htmlContent;
                
                // Fetch all post metadata
                const jsonRes = await fetch('/posts.json');
                const allPosts = await jsonRes.json();
                
                const currentPost = allPosts.find(p => p.slug === slug);

                if (currentPost) {
                    document.title = `${currentPost.title} | The John Everett`;
                    document.getElementById('post-title').textContent = currentPost.title;
                    
                    const dateOptions = { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' };
                    document.getElementById('post-date').textContent = new Date(currentPost.date).toLocaleDateString('en-US', dateOptions);
                    document.getElementById('post-read-time').textContent = currentPost.readTime || '5 min read';
                    
                    // Tags
                    document.getElementById('post-tag').textContent = currentPost.tags[0] || 'Article';
                    document.getElementById('post-tags').innerHTML = currentPost.tags.map(t => 
                        `<span class="text-xs px-3 py-1 bg-gray-100 font-[Plus Jakarta Sans] font-semibold uppercase tracking-wider hover:bg-[#D4AF37] hover:text-white transition-colors cursor-pointer">${t}</span>`
                    ).join('');
                    
                    // Featured image
                    if (currentPost.thumbnail) {
                        const postImageContainer = document.getElementById('post-image-container');
                        const postImage = document.getElementById('post-image');
                        postImage.src = currentPost.thumbnail;
                        postImage.alt = currentPost.title;
                        postImageContainer.classList.remove('hidden');
                        document.getElementById('post-caption').textContent = currentPost.title;
                    }
                    
                    // Related Articles Logic
                    const sortedPosts = allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));

                    let relatedArticles = sortedPosts.filter(p => {
                        return p.slug !== currentPost.slug && p.tags.some(tag => currentPost.tags.includes(tag));
                    });

                    if (relatedArticles.length < 3) {
                        const recentPosts = sortedPosts.filter(p => {
                            return p.slug !== currentPost.slug && !relatedArticles.find(rp => rp.slug === p.slug);
                        });
                        
                        const needed = 3 - relatedArticles.length;
                        relatedArticles.push(...recentPosts.slice(0, needed));
                    }

                    relatedArticles = relatedArticles.slice(0, 3);
                    
                    const relatedContainer = document.getElementById('related-articles');
                    if (relatedArticles.length > 0) {
                        relatedContainer.innerHTML = relatedArticles.map(post => `
                            <article class="group cursor-pointer flex flex-col gap-3 py-4">
                                <div class="overflow-hidden border border-gray-100 mb-2">
                                    <img 
                                        src="${post.thumbnail}" 
                                        alt="${post.title}" 
                                        class="w-full aspect-[3/2] object-cover transition-transform duration-500 group-hover:scale-105 grayscale-[20%] group-hover:grayscale-0"
                                    />
                                </div>
                                <div class="flex items-center gap-2 text-[10px] font-bold font-[Plus Jakarta Sans] tracking-widest uppercase text-gray-400">
                                    ${post.tags[0] || 'Article'}
                                </div>
                                <a href="/post.html?id=${post.slug}">
                                    <h3 class="text-xl font-serif font-bold leading-snug text-gray-900 group-hover:text-[#D4AF37] transition-colors">
                                        ${post.title}
                                    </h3>
                                </a>
                                <span class="text-xs text-gray-400 font-[Plus Jakarta Sans] mt-1">${post.readTime || '5 min read'}</span>
                            </article>
                        `).join('');
                    }

                } else {
                     throw new Error("Post metadata not found");
                }

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                
                // Smooth scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                // Highlight code blocks
                Prism.highlightAll();

            } catch (err) {
                document.getElementById('loading').innerHTML = `<p class="text-center text-red-600">${err.message || "Article not found."}</p>`;
            }
        }

        loadPost();
    </script>
</body>
</html>
